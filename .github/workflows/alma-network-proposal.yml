name: Alma network proposal checks
on:
  push:
    branches: [main, review/alma-network-pilot]
    paths: [hosts/vps/identity-network/**, .github/workflows/alma-network-proposal.yml]
  pull_request:
    paths: [hosts/vps/identity-network/**, .github/workflows/alma-network-proposal.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: salvaalba-dev/phantomyard-tools
          ref: 6c8fc1dbfb863247466f0f38797e0c32529a6f00
          path: _product
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install ./_product/phantomorg
      - run: python -m unittest discover -s hosts/vps/identity-network/tests -v
