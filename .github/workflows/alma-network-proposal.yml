name: Alma network proposal checks
on:
  push:
    branches: [main, review/alma-network-pilot]
    paths: [hosts/vps/identity-network/**, .github/workflows/alma-network-proposal.yml]
  pull_request:
    paths: [hosts/vps/identity-network/**, .github/workflows/alma-network-proposal.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: bash -n hosts/vps/identity-network/proposals/chrome-alma-ensure.sh
      - run: sudo visudo -cf hosts/vps/identity-network/proposals/90-chrome-alma-ensure
      - run: python -m unittest discover -s hosts/vps/identity-network/tests -v
