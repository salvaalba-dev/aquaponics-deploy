name: Meeting routing regression
on:
  push:
    branches: [codex/explicit-meeting-routing, main]
    paths: ['pipeline/post-meeting/**', '.github/workflows/meeting-routing.yml']
  pull_request:
    paths: ['pipeline/post-meeting/**', '.github/workflows/meeting-routing.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s pipeline/post-meeting -p test_route.py -v
      - run: bash -n pipeline/post-meeting/post-meeting.sh
      - run: python -m compileall -q pipeline/post-meeting/resolve-route.py pipeline/post-meeting/test_route.py
