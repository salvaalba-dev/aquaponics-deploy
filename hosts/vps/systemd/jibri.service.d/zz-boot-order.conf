# /etc/systemd/system/jibri.service.d/zz-boot-order.conf
#
# Incidente del 2026-10-06 (visto el 2026-10-09): en el arranque, pulseaudio-jibri
# fallo (salida 1) y se recupero sola 13 s despues. Pero jibri.service la exigia con
# Requires=, asi que su trabajo de arranque murio con "result 'dependency'" -- y systemd
# NO reintenta un trabajo que nunca llego a arrancar. jibri quedo muerto 2,5 dias.
#
# Arreglo en dos partes:
#   1. En jibri.service y en el drop-in pulseaudio.conf, Requires= pasa a Wants=: una
#      dependencia que falla y se recupera ya no cancela el arranque de jibri.
#      (Ojo, probado: un Requires= vacio en un drop-in NO borra el del fichero
#      principal; hay que cambiarlo alli.)
#   2. Este fichero deja el orden explicito y la politica de reintento: si X, icewm o
#      el audio tardan en estar listos, jibri reintenta cada 10 s sin limite hasta que
#      esten. Preferimos un bucle visible a un grabador muerto en silencio; el chequeo
#      `pm check-infra` lo canta en cuanto se mire.
#
# Nota: jibri.service lo instala el paquete de Jitsi. Si una actualizacion lo
# sobreescribe, hay que volver a aplicar estas dos lineas (viven en aquaponics-deploy).

[Unit]
Wants=jibri-xorg.service jibri-icewm.service pulseaudio-jibri.service
After=jibri-xorg.service jibri-icewm.service pulseaudio-jibri.service
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=10
