escalation_matrix:
- from: project_lead
  to: chief_of_staff
  condition: bloqueo operativo o desacuerdo de campo
  cross_department: false
- from: training_lead
  to: chief_of_staff
  condition: contenido fuera de alcance de formación
- from: volunteer_lead
  to: chief_of_staff
  condition: dudas o bloqueo del voluntariado
  cross_department: false
- from: marketing
  to: ceo
  condition: dudas o bloqueo de marketing
  cross_department: false
- from: cfo
  to: ceo
  condition: gasto por encima del umbral de política financiera
  cross_department: false
- from: chief_of_staff
  to: ceo
  condition: bloqueo no resuelto en su nivel
  cross_department: false
- from: '*'
  to: ceo
  condition: excepción Category 0 solicitada
  cross_department: true
- from: ceo
  to: project_lead
  condition: respuesta del CEO a escalada de proyecto (cierre de bucle)
  cross_department: false
  kind: response
- from: cfo
  to: chief_of_staff
  condition: coordinación financiera con jefatura de gabinete
  cross_department: true
  kind: coordination
- from: chief_of_staff
  to: cfo
  condition: coordinación financiera con el CFO
  cross_department: true
  kind: coordination
- from: chief_of_staff
  to: partnerships
  condition: coordinación de alianzas (jefatura de gabinete)
  cross_department: true
  kind: coordination
- from: partnerships
