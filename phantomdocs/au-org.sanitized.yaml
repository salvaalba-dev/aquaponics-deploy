  default_language: es
departments:
- id: direccion
  name: Dirección
  parent: null
  access_policy: level-3
- id: operaciones
  name: Operaciones
  parent: direccion
  access_policy: level-2
- id: formacion
  name: Formación
  parent: direccion
  access_policy: level-2
- id: finanzas
  name: Finanzas
  parent: direccion
  access_policy: level-2
- id: alianzas
  name: Alianzas
  parent: direccion
  access_policy: level-2
- id: marketing
