  parent: direccion
  access_policy: level-2
- id: voluntariado
  name: Voluntariado
  parent: direccion
  access_policy: level-2

roles:
- id: ceo
  name: CEO
  department: direccion
  reports_to: null
  reports_to_human: Salvador
  functions:
  - vision
  - liderazgo
  - wikipedia_au
  - tools
  access_level: level-3
  security_exceptions:
  - category-4
  description: Dirección general, estrategia, decisiones que afectan a toda la organización,
    relaciones con la presidencia (Salvador). Contactar ante dudas sobre prioridades,
    conflictos entre departamentos, autorización de nuevas líneas de trabajo o cualquier
    cosa que nadie más pueda decidir.
- id: chief_of_staff
  name: Chief of Staff
  department: direccion
  reports_to: ceo
  functions:
  - coordinacion
  - escalado
  - seguimiento
  access_level: level-2
  security_exceptions:
  - category-3
  - category-4
  description: Coordinación de proyectos, comunicación, educación, alianzas, voluntariado.
    Supervisa a Elena y Alicia (Voluntariado). Contactar ante problemas
    operativos en un departamento gestionado, necesidad de coordinación entre equipos
    o escalado de un issue.
- id: cfo
  name: CFO
  department: finanzas
  reports_to: ceo
  functions:
  - finanzas
  - reporting
  access_level: level-2
  security_exceptions:
  - category-3
  - category-4
  description: Presupuestos, facturación, tesorería, cash flow, informes financieros,
    viabilidad económica. Contactar para saber si hay presupuesto, aprobar un gasto,
    revisar liquidez o preparar un informe financiero.
- id: project_lead
  name: Project Lead
  department: operaciones
  reports_to: chief_of_staff
  functions:
  - proyectos
  - seguimiento_campo
  access_level: level-2
  security_exceptions: []
  description: Proyecto ALMAPONIA (GO Project). Coordinación del piloto, documentación,
    ejecución. Contactar para cualquier cosa relacionada con ALMAPONIA.
- id: training_lead
  name: Training Lead
  department: formacion
  reports_to: chief_of_staff
  functions:
  - formacion
  - documentacion
  access_level: level-2
  security_exceptions: []
  description: Talleres, cursos, material formativo, educación en acuaponía. Contactar
    para contenido formativo, organizar un taller o revisar material didáctico.
- id: partnerships
  name: Head of Alliances & Fundraising
  department: alianzas
  reports_to: ceo
  functions:
  - alianzas
  - fundraising
  - subvenciones
  access_level: level-2
  security_exceptions: []
  description: Alianzas estratégicas y captación de fondos (convocatorias, propuestas
    y justificaciones). Pipeline de grants, relación con financiadores (Unión Europea,
    fundaciones, empresa) y cumplimiento post-award. Reporta a Dirección (CEO).
    Contactar para propuestas, plazos de convocatoria, justificación de ayudas o
    cualquier acuerdo con un financiador.

- id: marketing
  name: Head of Marketing & Communication
  department: marketing
  reports_to: ceo
  functions:
  - marketing
  - comunicacion
  access_level: level-2
  security_exceptions: []
  description: Marketing y comunicación (redes sociales, web, prensa, newsletter
    y estrategia de marca). Reporta a Dirección (CEO). Contactar para contenido
    público, campañas, difusión de logros o material de marca.
- id: volunteer_lead
  name: Responsable de Voluntariado
  department: voluntariado
  reports_to: chief_of_staff
  functions:
  - voluntariado
  - coordinacion_voluntarios
  access_level: level-2
  security_exceptions: []
  description: Responsable del voluntariado (reclutamiento, coordinación y cuidado del equipo). Reporta a Jefatura de Gabinete (Chief of Staff). Contactar para altas, tareas y dudas del voluntariado.

